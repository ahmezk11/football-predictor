<!doctype html>
<meta charset="utf-8">
<title>Starting…</title>
<style>
  :root{ --bg:#0d1117; --text:#e6edf3; --muted:#8b98a5; --accent:#3fb950 }
  @media (prefers-color-scheme: light){ :root{ --bg:#f6f8fa; --text:#1f2328; --muted:#636c76 } }
  html,body{height:100%;margin:0}
  body{background:var(--bg);color:var(--text);display:flex;align-items:center;
       justify-content:center;flex-direction:column;gap:20px;
       font:15px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
       user-select:none;-webkit-app-region:no-drag}
  /* Only the title-bar strip drags the window. Making the whole body draggable
     leaves a region that can outlive this page and swallow every click in the
     app that loads after it. */
  .titlebar{position:fixed;top:0;left:0;right:0;height:38px;-webkit-app-region:drag}
  .ball{width:34px;height:34px;border-radius:50%;border:3px solid var(--muted);
        border-top-color:var(--accent);animation:spin .9s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  h1{font-size:1.05rem;margin:0;font-weight:600;letter-spacing:-.01em}
  p{margin:0;color:var(--muted);font-size:.85rem}
</style>
<div class="titlebar"></div>
<div class="ball"></div>
<h1>Match Predictor</h1>
<p id="msg">Loading the model…</p>
<script>
  const lines = ['Loading the model…', 'Rebuilding team ratings…', 'Almost there…'];
  let i = 0;
  setInterval(() => { i = (i + 1) % lines.length;
                      document.getElementById('msg').textContent = lines[i]; }, 4000);
</script>
